version: "3.9"

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: dtai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-digital_twin_ai}
      POSTGRES_USER:     ${POSTGRES_USER:-dtai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtai_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtai} -d ${POSTGRES_DB:-digital_twin_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dtai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dtai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL:                    postgresql://${POSTGRES_USER:-dtai}:${POSTGRES_PASSWORD:-dtai_pass}@postgres:5432/${POSTGRES_DB:-digital_twin_ai}
      SECRET_KEY:                      ${SECRET_KEY:-change-me-in-production}
      ALGORITHM:                       ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES:     ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALLOWED_ORIGINS:                 ${ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      OPENAI_API_KEY:                  ${OPENAI_API_KEY:-}
      OPENAI_MODEL:                    ${OPENAI_MODEL:-gpt-4o}
      OPENAI_MAX_TOKENS:               ${OPENAI_MAX_TOKENS:-800}
      OPENAI_TEMPERATURE:              ${OPENAI_TEMPERATURE:-0.3}
      RATE_LIMIT_MESSAGES_PER_HOUR:    ${RATE_LIMIT_MESSAGES_PER_HOUR:-30}
      REDIS_URL:                       redis://redis:6379/0
      REPORTS_DIR:                     /app/reports
    ports:
      - "8000:8000"
    volumes:
      - reports_data:/app/reports
      - ml_models:/app/ml_models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Streamlit Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dtai_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
    driver: local
  reports_data:
    driver: local
  ml_models:
    driver: local

networks:
  default:
    name: dtai_network
