name: Digital Twin AI — CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── 1. Lint & Security ───────────────────────────────────────────────────────
  lint-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install black bandit flake8

      - name: Black format check
        run: black --check --diff backend/ frontend/
        continue-on-error: true   # warn but don't fail CI on style

      - name: Bandit security scan
        run: |
          bandit -r backend/ -ll -ii \
            --exclude backend/app/ml,backend/migrations \
            -f json -o bandit-report.json || true
          bandit -r backend/ -ll -ii \
            --exclude backend/app/ml,backend/migrations
        # Fails on HIGH + HIGH confidence issues

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ── 2. Unit + Integration Tests ──────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:                sqlite:///./test_digital_twin_ai.db
      SECRET_KEY:                  test-secret-key-ci
      ALGORITHM:                   HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      OPENAI_API_KEY:              ""          # intentionally empty — tests use mocks
      RATE_LIMIT_MESSAGES_PER_HOUR: "1000"    # disable rate limit in tests
      REDIS_URL:                   ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -x

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              rate = float(root.attrib.get('line-rate', 0)) * 100
              print(f'Overall coverage: {rate:.1f}%')
          except:
              print('Coverage report not available')
          " >> $GITHUB_STEP_SUMMARY

  # ── 3. Build Docker Images ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-security, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: dtai-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: dtai-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test docker-compose config
        run: docker compose config

  # ── 4. Smoke Test (optional, on main) ────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Start services
        env:
          SECRET_KEY: ci-smoke-test-key
          OPENAI_API_KEY: ""
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_db
        run: |
          docker compose up -d postgres redis
          sleep 15
          docker compose up -d backend
          sleep 20

      - name: Health check
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused \
            -f http://localhost:8000/health
          echo "Backend health: OK"

      - name: API smoke test
        run: |
          # Register a test user
          curl -sf -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI User","email":"ci@test.com","password":"citest123","age":25,"occupation":"Tester"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Register OK, id='+str(d['id']))"

          # Login
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/auth/login \
            -d 'username=ci@test.com&password=citest123' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "Login OK"

          # Protected endpoint
          curl -sf http://localhost:8000/api/users/profile \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Profile OK, name='+d['name'])"

          echo "All smoke tests passed!"

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
